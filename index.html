                this.onTopicSelected = this.onTopicSelected.bind(this);
                this.onSelectAll = this.onSelectAll.bind(this);
                this.onResetAll = this.onResetAll.bind(this);

                console.log("flag")
            }

            onInputChange(desired) {
                var self = this
                return function(e){
                    if (desired == e.target.value.trim()) {
                        self.goNext(true)
                    }
                }
            }

            onTopicSelected(topic) {
                var self = this
                return function(e) {

                    if (self.state.activeTopics.has(topic)) {
                        if (self.state.activeTopics.size == 1) return
                        self.state.activeTopics.delete(topic)
                    } else {
                        self.state.activeTopics.add(topic)
                    }

                    self.state.currentTopic = Math.floor(Math.random() * self.state.activeTopics.size)

                    self.setState(self.state)
                }
            }

            onNextClick() {
                this.goNext(false)
            }

            onSelectAll() {
                this.state.allTopics.forEach(t => {
                    this.state.activeTopics.add(t)
                });

                this.setState(this.state)
            }

            onResetAll() {
                var fst = this.state.activeTopics.values().next().value
                this.state.activeTopics = new Set()
                this.state.activeTopics.add(fst)

                this.state.currentTopic = 0

                this.setState(this.state)
            }

            render() {
                const active = this.state.activeTopics
                const list = [...active]

                const topic = list[this.state.currentTopic]
                const fact = topic.facts[Math.floor(Math.random() * topic.facts.length)]

                const question = Math.floor(Math.random() * fact.options.length)

                const optionsDisplay = fact.options.map((x, i) => <i> { question != i ? x : <input name="answer" onChange={this.onInputChange(x)} autoFocus defaultValue="" ref={el => this.mainInput = el}/>} </i>)

                this.currentLine = `[${topic.name}] ${"".concat(...fact.required.map(x => " " + x))} ${"".concat(...fact.options.map(x => " " + x))} ${fact.ending}`

                return <div class="topic-component container">
                    <div  class="mb-3">
                        <h1>{topic.name}</h1>

                        {fact.required.map(x => <b> {x} </b>)}

                        {optionsDisplay}

                        <b> {fact.ending} </b>
                    </div>

                    <div class="card text-bg-light mb-3">
                        <div class="card-header">Previous</div>
                        <div class="card-body">
                            <p class="card-text">{this.state.previous}</p>
                        </div>
                    </div>

                    <button type="button" class="btn btn-primary" onClick={this.onNextClick}>
                        Next
                    </button>

                    <div>
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-check-circle-fill" viewBox="0 0 16 16">
                            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0m-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
                        </svg>:{this.state.countTrue}
                        <i> </i>
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-slash-circle" viewBox="0 0 16 16">
                            <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                            <path d="M11.354 4.646a.5.5 0 0 0-.708 0l-6 6a.5.5 0 0 0 .708.708l6-6a.5.5 0 0 0 0-.708"/>
                        </svg>:{this.state.countFalse}
                    </div>
                
                    <div class="card text-bg-light mb-3">
                        <div class="card-body">
                            <button class="btn btn-toggle d-inline-flex align-items-center rounded border-0" data-bs-toggle="collapse" data-bs-target="#home-collapse" aria-expanded="false">
                            Choose topics
                            </button>
                            <div class="collapse show" id="home-collapse">
                                <ul class="btn-toggle-nav list-unstyled fw-normal pb-1 small">
                                    {topics.keys().map(x => <li><a href={x} class="link-dark d-inline-flex text-decoration-none rounded">{x}</a></li>)}
                                </ul>
                            </div>
                        </div>
                    </div>

                    <div class="btn-group" role="group">
                        <button type="button" class="btn btn-primary" onClick={this.onSelectAll}>Select all</button>
                        <button type="button" class="btn btn-primary" onClick={this.onResetAll}>Reset all</button>
                    </div>
                    <ul class="list-group">
                        {data.map(t => <li class="list-group-item"><input class="form-check-input" type="checkbox" id={t.name} onChange={this.onTopicSelected(t)} defaultChecked={this.state.activeTopics.has(t)} checked={this.state.activeTopics.has(t)}/><label class="form-check-label" for={t.name}>{t.name}</label></li>)}
                    </ul>
                </div>
            }

            goNext(isCorrect) {
                this.mainInput.value = "";

                this.state.currentTopic = Math.floor(Math.random() * this.state.activeTopics.size)
                this.state.previous = this.currentLine
                if (isCorrect) {
                    this.state.countTrue ++
                } else {
                    this.state.countFalse ++
                }
                this.setState(this.state)
            }
        }
      
        function App(){
            return(
            <div>
                <TopicComponent topics={data} />
            </div>
            )
        }

        ReactDOM.render(
            <App />,
            rootElement
        )
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    <!-- <script src="https://getbootstrap.com/docs/5.2/examples/sidebars/sidebars.js"></script> -->
  </body>

</html>
